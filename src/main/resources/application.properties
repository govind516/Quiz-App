spring.application.name=quiz_app

# Supabase Postgres (set via env vars on Render / local shell):
#   Session pooler: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   Direct (IPv6):  jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/questionDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Supabase free tier has a connection cap; keep the pool modest
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=240000

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-prod-32bytes-minimum-padding!!}
app.jwt.access-expiration-ms=${JWT_ACCESS_TTL_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_TTL_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.admin.email=${ADMIN_EMAIL:admin@quizapp.dev}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Gemini AI question generation (free tier; confirm current model name in Google AI Studio)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Upstash Redis (leaderboards) - rediss:// URL from the Upstash dashboard.
# Leave empty to run without leaderboards (endpoints degrade gracefully).
spring.data.redis.url=${REDIS_URI:redis://localhost:6379}
management.health.redis.enabled=false

# Rate limits (requests per window per identity/IP)
app.ratelimit.submit-limit=${RL_SUBMIT_LIMIT:10}
app.ratelimit.start-limit=${RL_START_LIMIT:30}
app.ratelimit.auth-limit=${RL_AUTH_LIMIT:5}
app.ratelimit.window-seconds=${RL_WINDOW_SECONDS:60}

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html
