spring.application.name=quiz_app

# Supabase Postgres (set via env vars on Render / local shell):
#   Session pooler: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   Direct (IPv6):  jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/questionDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Supabase free tier has a connection cap; keep the pool modest
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-prod-32bytes-minimum-padding!!}
app.jwt.access-expiration-ms=${JWT_ACCESS_TTL_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_TTL_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.admin.email=${ADMIN_EMAIL:admin@quizapp.dev}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Gemini AI question generation (free tier; confirm current model name in Google AI Studio)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html
