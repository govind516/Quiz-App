name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # No -DskipTests: test execution gates the deploy.
      - run: ./mvnw -B test
      # Report-only: hygiene ratchet (import order, unused imports, whitespace).
      - run: ./mvnw -B spotless:check
        continue-on-error: true

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Report-only: does not gate merges until the pre-existing violations are fixed.
      - run: npm run lint
        continue-on-error: true
      # Report-only first pass: frontend coverage starts here, gating comes later.
      - run: npm run test
        continue-on-error: true
      # Report-only until the baseline is clean.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build
