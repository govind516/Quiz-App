name: Keep backend warm

on:
  schedule:
    - cron: '*/10 8-22 * * *' 
      # '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {} # manual wake before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 60 https://quizapp-backend-lqrc.onrender.com/actuator/health || true
